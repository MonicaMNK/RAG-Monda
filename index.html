</style><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><script>
const $=i=>document.getElementById(i),U=()=>Math.random().toString(16).slice(2,10),now=()=>new Date().toISOString().slice(0,16).replace('T',' '),r2=x=>Math.round(x*100)/100;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

const S={me:null,off:false,fails:0,cid:null,aid:null,take:null,hoy:'2026-10-04',
users:[mk('u1','Ana Admin','admin@demo.invalid','administrador'),mk('u2','Daniel Docente','docente@demo.invalid','docente'),mk('u3','Luis Estudiante','estudiante@demo.invalid','estudiante'),mk('u4','Marta Ríos','marta@demo.invalid','estudiante'),mk('u5','Pedro Soto','pedro@demo.invalid','estudiante'),mk('u6','Otra Docente','docente2@demo.invalid','docente')],
courses:[{id:'c1',n:'Introducción a Sistemas',d:'u2',e:'activo'},{id:'c2',n:'Fundamentos de Datos',d:'u2',e:'activo'},{id:'c3',n:'Curso de otra docente',d:'u6',e:'activo'}],
enr:[['c1','u3','activa'],['c1','u4','activa'],['c1','u5','activa'],['c3','u3','activa']].map(([c,s,e])=>({c,s,e})),
cont:[{id:'m1',c:'c1',doc:'Unidad 1 — Sistemas y componentes',v:1,est:'indexado',act:true}],
frag:[{c:'c1',doc:'Unidad 1',v:1,p:2,kw:['sistema','componente','proposito','conjunto'],t:'Un sistema es un conjunto de componentes relacionados que actúan con un propósito.'},{c:'c1',doc:'Unidad 1',v:1,p:3,kw:['entrada','proceso','salida','retroalimentacion','flujo'],t:'Las entradas, procesos y salidas describen el flujo de un sistema; la retroalimentación permite ajustarlo.'},{c:'c1',doc:'Unidad 1',v:1,p:4,kw:['entorno','externo','frontera'],t:'El entorno es todo lo externo al sistema que lo influye; la frontera separa ambos.'}],
asm:[{id:'a1',c:'c1',t:'Evaluación de práctica 1',est:'publicada',ini:'2026-10-01T08:00',fin:'2026-12-31T23:59',qs:[Q('q1','¿Qué caracteriza a un sistema?',['Sus componentes están relacionados','Sus componentes nunca interactúan','Tiene un solo elemento'],'A','La relación entre componentes permite actuar con un propósito.','Unidad 1 · v1 · párr. 2'),Q('q2','¿Qué es el entorno de un sistema?',['Sus componentes internos','Todo lo externo que lo influye','Su salida'],'B','El entorno es lo externo que influye en el sistema.','Unidad 1 · v1 · párr. 4')]}],
att:[{e:'u3',c:'c1',t:'Práctica previa 1',s:10},{e:'u3',c:'c1',t:'Práctica previa 2',s:14},{e:'u4',c:'c1',t:'Práctica previa 1',s:8}],act:{u3:1,u4:2,u5:8},res:{},rev:{},chat:{},q:[],done:{},last:[],jobs:[],out:[],
cfg:{topK:4,umbral:.35,modelo:'gpt-4o',v:1},aud:[],pv:1,
perm:{administrador:['admin.usuarios','admin.roles','admin.config','admin.auditoria'],docente:['cursos.ver','cursos.gestionar','contenidos.cargar','tutor.consultar','eval.generar','eval.revisar','seguimiento.ver'],estudiante:['cursos.ver','tutor.consultar','eval.resolver','progreso.propio']}};
const PERMS=[['cursos.ver','Ver cursos y materiales autorizados'],['cursos.gestionar','Crear cursos y gestionar matrículas'],['contenidos.cargar','Cargar y versionar materiales'],['tutor.consultar','Consultar el tutor RAG'],['eval.generar','Generar evaluaciones con IA'],['eval.revisar','Revisar, aprobar y publicar'],['eval.resolver','Resolver evaluaciones'],['seguimiento.ver','Seguimiento, alertas y reportes'],['progreso.propio','Ver progreso propio'],['admin.usuarios','Administrar usuarios'],['admin.roles','Administrar matriz de permisos'],['admin.config','Configurar parámetros RAG'],['admin.auditoria','Consultar auditoría']];
const PG=[['usuarios','Usuarios','admin.usuarios','Administración'],['roles','Roles y permisos','admin.roles'],['config','Configuración RAG','admin.config'],['auditoria','Auditoría','admin.auditoria'],['cursos','Mis cursos','cursos.ver','Académico'],['contenidos','Contenidos','cursos.ver'],['tutor','Tutor del curso','tutor.consultar'],['generar','Generar evaluación','eval.generar'],['revision','Revisar y publicar','eval.revisar'],['evaluaciones','Evaluaciones','eval.resolver'],['seguimiento','Seguimiento','seguimiento.ver'],['progreso','Mi progreso','progreso.propio'],['perfil','Mi perfil',null,'Cuenta'],['sync','Sincronización',null]];
const can=p=>S.perm[S.me.rol].includes(p),allowed=p=>{const g=PG.find(x=>x[0]===p);return !!g&&(!g[2]||can(g[2]))};
const aud=(ac,o,r='éxito')=>S.aud.unshift({t:now(),a:S.me?S.me.correo:'anónimo',ac,o,r,c:U()});
function say(t,bad){const e=$('toast');e.textContent=t;e.className=bad?'bad':'';e.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>e.style.display='none',6500)}
const ps=id=>'EST-'+String(S.users.filter(u=>u.rol==='estudiante').findIndex(u=>u.id===id)+1).padStart(3,'0'),uname=id=>(S.users.find(u=>u.id===id)||{}).nombre;
const myC=()=>S.me.rol==='docente'?S.courses.filter(c=>c.d===S.me.id):S.courses.filter(c=>c.e==='activo'&&S.enr.some(e=>e.c===c.id&&e.s===S.me.id&&e.e==='activa'));
const csel=()=>{const l=myC();if(!l.find(c=>c.id===S.cid))S.cid=l[0]&&l[0].id;return l.length?`<label>Curso<select onchange="S.cid=this.value;S.aid=null;R()">${l.map(c=>`<option value="${c.id}" ${c.id===S.cid?'selected':''}>${esc(c.n)}</option>`).join('')}</select></label>`:'<div class="notice">No tienes cursos autorizados.</div>'};
const head=(id,n,d)=>`<small>DISEÑO PI7 · ${id}</small><h1>${n}</h1><p class="muted">${d}</p>`;
const avg=a=>a.length?r2(a.reduce((x,y)=>x+y.s,0)/a.length):null;
const score=(q,c)=>{const n=norm(q);return S.frag.filter(f=>f.c===c).map(f=>{const m=f.kw.filter(k=>n.includes(k)).length;return{...f,sc:m?Math.min(.95,.3+.2*m):0}}).filter(f=>f.sc>=S.cfg.umbral).sort((a,b)=>b.sc-a.sc).slice(0,S.cfg.topK)};
const tag=(t,c)=>`<span class="tag ${c||t}">${t}</span>`;
/* ---------- acceso ---------- */
function login(){return`<div class="lg"><div class="card"><div class="brand">monda</div><h1>Iniciar sesión</h1><p class="muted">UI-01 · Acceso y recuperación (RF-01). El rol lo determina la cuenta, no un selector.</p><form id="lf"><label>Correo institucional<input id="em" type="email" required autocomplete="username"></label><label>Contraseña<input id="pw" type="password" required autocomplete="current-password"></label><div class="row"><button>Ingresar</button><button type="button" class="s" onclick="rec()">Recuperar acceso</button></div></form><div class="notice">Cuentas de demostración · contraseña <b>demostracion</b></div><div class="row"><button class="s" onclick="fill('admin')">Administrador</button><button class="s" onclick="fill('docente')">Docente</button><button class="s" onclick="fill('estudiante')">Estudiante</button></div><p class="foot">Tras 5 intentos fallidos el acceso se bloquea temporalmente (429).</p></div></div>`}
function fill(r){$('em').value=r+'@demo.invalid';$('pw').value='demostracion'}
function rec(){const e=$('em').value.trim();say(/^\S+@\S+\.\S+$/.test(e)?'Si la cuenta existe, se enviará un enlace de un solo uso con vigencia de 15 minutos.':'422: ingresa un correo válido.',!/^\S+@\S+\.\S+$/.test(e))}
function doLogin(e){e.preventDefault();if(S.fails>=5)return say('429: demasiados intentos. Espera antes de reintentar.',1);const u=S.users.find(x=>x.correo===$('em').value.trim().toLowerCase());if(!u||u.pw!==$('pw').value){S.fails++;return say('401: credenciales inválidas.',1)}if(u.estado!=='activo')return say('403: la cuenta no está activa. Contacta al administrador.',1);S.me=u;S.fails=0;S.take=null;aud('Inicio de sesión','sesión');location.hash='';R();say('Sesión iniciada como '+u.rol+'. Token de 30 min (simulado).')}
function logout(){aud('Cierre de sesión','sesión');S.me=null;location.hash='';R();say('Sesión cerrada; el refresh token queda revocado.')}
/* ---------- administración (M2) ---------- */
const lastAdm=u=>u.rol==='administrador'&&u.estado==='activo'&&S.users.filter(x=>x.rol==='administrador'&&x.estado==='activo').length===1;
function uRol(id,r){const u=S.users.find(x=>x.id===id);if(lastAdm(u)&&r!=='administrador'){aud('Cambio de rol',u.correo,'409');R();return say('409 (RN-04): no se puede degradar al último administrador activo.',1)}aud('Cambio de rol',u.correo+': '+u.rol+' → '+r);u.rol=r;u.v++;R();say('Rol actualizado y auditado.')}
function uEst(id){const u=S.users.find(x=>x.id===id);if(u.estado==='activo'&&lastAdm(u)){aud('Desactivar usuario',u.correo,'409');return say('409 (RN-04): no se puede desactivar al último administrador activo.',1)}const n=u.estado==='activo'?'inactivo':'activo';aud('Cambio de estado',u.correo+': '+u.estado+' → '+n);u.estado=n;u.v++;R();say('Estado actualizado y auditado.')}
function uAdd(){const c=$('nc').value.trim().toLowerCase(),n=$('nn').value.trim(),r=$('nr').value;if(!/^\S+@\S+\.\S+$/.test(c)||n.length<2)return say('422: correo o nombre inválido.',1);if(S.users.some(u=>u.correo===c))return say('409: el correo ya existe.',1);S.users.push(mk('u'+U(),n,c,r,'pendiente'));aud('Crear usuario',c+' ('+r+')');R();say('Usuario creado en estado pendiente; la activación es por enlace.')}
function dRoles(){S.fr=$('fr').value;R()}
const V={};
V.usuarios=()=>{const f=S.fr||'';return head('UI-09','Usuarios y roles','Solo Administrador (RF-02). Toda acción queda en la auditoría.')+`<div class="card"><div class="row"><label>Filtrar por rol<select id="fr" onchange="dRoles()"><option value="">Todos</option>${['administrador','docente','estudiante'].map(r=>`<option ${f===r?'selected':''}>${r}</option>`).join('')}</select></label></div><table><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Versión</th><th>Acción</th></tr>${S.users.filter(u=>!f||u.rol===f).map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.correo)}</td><td><select aria-label="Rol de ${esc(u.nombre)}" onchange="uRol('${u.id}',this.value)">${['administrador','docente','estudiante'].map(r=>`<option ${r===u.rol?'selected':''}>${r}</option>`).join('')}</select></td><td>${tag(u.estado)}</td><td>v${u.v}</td><td><button class="s" onclick="uEst('${u.id}')">${u.estado==='activo'?'Desactivar':'Activar'}</button></td></tr>`).join('')}</table></div><div class="card"><h2>Crear usuario</h2><div class="row"><label>Correo<input id="nc" type="email"></label><label>Nombre<input id="nn"></label><label>Rol<select id="nr"><option>docente</option><option>estudiante</option><option>administrador</option></select></label><button onclick="uAdd()">Crear</button></div></div>`};
function pSave(){const np={administrador:[],docente:[],estudiante:[]};document.querySelectorAll('[data-r]').forEach(c=>{if(c.checked)np[c.dataset.r].push(c.dataset.p)});const ch=[];for(const r in np){const a=np[r].filter(p=>!S.perm[r].includes(p)).map(p=>'+'+p),b=S.perm[r].filter(p=>!np[r].includes(p)).map(p=>'-'+p);if(a.length||b.length)ch.push(r+': '+a.concat(b).join(' '))}if(!ch.length)return say('Sin cambios.');S.perm=np;S.pv++;aud('Actualizar matriz de permisos',ch.join(' | '));R();say('Matriz de permisos guardada (v'+S.pv+') y auditada. Aplica de inmediato.')}
V.roles=()=>head('UI-09','Roles y permisos','Matriz RBAC editable. Los permisos administrativos son exclusivos del rol Administrador.')+`<div class="card"><table><tr><th>Permiso</th>${['administrador','docente','estudiante'].map(r=>`<th>${r}</th>`).join('')}</tr>${PERMS.map(([p,d])=>`<tr><td><b>${p}</b><br><small>${d}</small></td>${['administrador','docente','estudiante'].map(r=>{const adm=p.startsWith('admin.'),lock=adm;return`<td><input type="checkbox" style="width:auto;margin:0" data-r="${r}" data-p="${p}" aria-label="${p} para ${r}" ${S.perm[r].includes(p)?'checked':''} ${lock?'disabled':''}></td>`}).join('')}</tr>`).join('')}</table><p class="muted">Versión de la matriz: v${S.pv}. Prueba: quita «tutor.consultar» al estudiante y entra con esa cuenta.</p><button onclick="pSave()">Guardar matriz</button></div>`;
function cSave(){const k=+$('ck').value,u=+$('cu').value,m=$('cm').value;if(+$('cv').value!==S.cfg.v){aud('Actualizar configuración','RAG','409');return say('409 (RN-05): otra sesión cambió la configuración. Recarga la vista.',1)}if(!(Number.isInteger(k)&&k>=1&&k<=10)||!(u>=0&&u<=1))return say('422: top-k entre 1 y 10; umbral entre 0 y 1.',1);const b=JSON.stringify({k:S.cfg.topK,u:S.cfg.umbral,m:S.cfg.modelo});S.cfg={topK:k,umbral:u,modelo:m,v:S.cfg.v+1};aud('Actualizar configuración','RAG: '+b+' → '+JSON.stringify({k,u,m}));R();say('Configuración guardada (v'+S.cfg.v+') y auditada.')}
V.config=()=>head('UI-09','Configuración RAG','Parámetros aplicados sin redespliegue (control optimista por versión, RN-05).')+`<div class="card" style="max-width:560px"><input type="hidden" id="cv" value="${S.cfg.v}"><label>Top k<input id="ck" type="number" min="1" max="10" value="${S.cfg.topK}"></label><label>Umbral de coseno<input id="cu" type="number" min="0" max="1" step=".01" value="${S.cfg.umbral}"></label><label>Modelo LLM<select id="cm">${['gpt-4o','gpt-4o-mini'].map(m=>`<option ${m===S.cfg.modelo?'selected':''}>${m}</option>`).join('')}</select></label><p class="muted">Versión actual: v${S.cfg.v}</p><div class="row"><button onclick="cSave()">Guardar</button><button class="s" onclick="S.cfg.v++;say('Simulado: otra sesión modificó la configuración. Intenta guardar.')">Simular edición concurrente</button></div></div>`;
V.auditoria=()=>{const f=norm(S.af||'');const l=S.aud.filter(a=>!f||norm(a.a).includes(f));return head('UI-09','Auditoría','Registro de solo inserción: actor, fecha, objeto, resultado y correlationId (RNF-05).')+`<div class="card"><label>Filtrar por actor<input value="${esc(S.af||'')}" onchange="S.af=this.value;R()" placeholder="correo"></label><table><tr><th>Fecha</th><th>Actor</th><th>Acción</th><th>Objeto</th><th>Resultado</th><th>correlationId</th></tr>${l.map(a=>`<tr><td>${a.t}</td><td>${esc(a.a)}</td><td>${esc(a.ac)}</td><td>${esc(a.o)}</td><td>${a.r==='éxito'?tag('éxito'):tag(a.r,'error')}</td><td>${a.c}</td></tr>`).join('')||'<tr><td colspan="6">Sin registros.</td></tr>'}</table></div>`};
/* ---------- cursos y matrículas (M3) ---------- */
function cNew(){const n=$('cn').value.trim();if(n.length<3)return say('422: nombre de curso inválido (mín. 3 caracteres).',1);S.courses.push({id:'c'+U(),n,d:S.me.id,e:'activo'});aud('Crear curso',n);R();say('Curso creado.')}
function cArch(id){const c=S.courses.find(x=>x.id===id&&x.d===S.me.id);if(!c)return say('403: curso ajeno.',1);c.e=c.e==='activo'?'archivado':'activo';aud('Cambiar estado de curso',c.n+': '+c.e);R();say('Curso '+c.e+'. Los resultados no se eliminan.')}
function eAdd(){const s=$('es').value;if(!myC().find(c=>c.id===S.cid))return say('403: curso ajeno.',1);if(S.enr.some(e=>e.c===S.cid&&e.s===s))return say('409 (RN-06): el estudiante ya está matriculado.',1);S.enr.push({c:S.cid,s,e:'activa'});aud('Matricular',uname(s)+' en '+S.cid);R();say('Matrícula registrada.')}

V.perfil=()=>head('UI-02','Mi perfil','Solo se editan campos permitidos; el rol no es modificable desde aquí (RF-03).')+`<div class="card" style="max-width:520px"><label>Nombre<input id="pn" value="${esc(S.me.nombre)}"></label><label>Correo<input value="${esc(S.me.correo)}" disabled></label><label>Rol<input value="${S.me.rol}" disabled></label><div class="row"><button onclick="pf()">Guardar</button><button class="s" onclick="logout()">Cerrar sesión</button></div></div>`;
function apply(a){const h=JSON.stringify(a.payload);if(S.done[a.actionId])return S.done[a.actionId]===h?'repetida':'conflicto';if(!['valoracion','perfil'].includes(a.tipo))return'rechazada';const u=S.users.find(x=>x.id===(a.u||S.me.id));if(a.tipo==='perfil'){if(u.v!==a.v)return'conflicto';u.nombre=a.payload.n;u.v++}else{const m=Object.values(S.chat).flat().find(x=>x.id===a.payload.id);if(m)m.rt=a.payload.u?'útil':'no útil'}S.done[a.actionId]=h;return'aplicada'}
function sy(){if(S.off)return say('Conecta antes de sincronizar.',1);S.out=[];S.last=[];S.q.forEach(a=>{if(a.estado==='conflicto')return;const r=apply(a);a.estado=r;S.out.push([a.actionId,a.tipo,r]);if(r==='aplicada')S.last.push({...a})});S.q=S.q.filter(a=>!['aplicada','repetida','rechazada'].includes(a.estado));aud('Sincronizar',S.out.length+' acciones');R();say('Sincronización procesada: cada acción se aplica una sola vez.')}
function resend(){if(!S.last.length)return say('No hay acciones previas para reenviar.',1);S.out=S.last.map(a=>[a.actionId,a.tipo,apply(a)]);R();say('Reenvío: las acciones ya aplicadas devuelven «repetida» (RN-21).')}
function dis(i){S.q.splice(i,1);R()}
V.sync=()=>head('UI-10','Sincronización','Cola local de acciones permitidas: borradores de perfil y valoraciones (RF-15, RN-20).')+`<div class="card"><p>Conexión: <b>${S.off?'Sin conexión':'En línea'}</b></p><p class="muted">Activa «Sin conexión» en la cabecera, valora una respuesta del tutor o edita tu perfil y vuelve a conectar.</p><table><tr><th>actionId</th><th>Tipo</th><th>Estado</th><th></th></tr>${S.q.map((a,i)=>`<tr><td>${a.actionId}</td><td>${a.tipo}</td><td>${tag(a.estado,a.estado==='conflicto'?'conflicto':'pendiente')}</td><td>${a.estado==='conflicto'?`<button class="s" onclick="dis(${i})">Descartar copia local</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4">Cola vacía.</td></tr>'}</table><div class="row" style="margin-top:14px"><button onclick="sy()">Sincronizar</button><button class="s" onclick="resend()">Reenviar último lote</button><button class="s" onclick="say('Rechazada (RN-20): los intentos de evaluación y los cambios de rol no se encolan; requieren conexión.',1)">Intentar encolar cierre de evaluación</button></div></div>${S.out.length?`<div class="card"><h2>Último resultado</h2><table><tr><th>actionId</th><th>Tipo</th><th>Resultado</th></tr>${S.out.map(o=>`<tr><td>${o[0]}</td><td>${o[1]}</td><td>${tag(o[2],o[2]==='aplicada'||o[2]==='repetida'?'':'conflicto')}</td></tr>`).join('')}</table></div>`:''}`;
/* ---------- shell ---------- */
function R(){const app=$('app');if(!S.me){app.innerHTML=login();$('lf').onsubmit=doLogin;return}
let p=location.hash.slice(1);if(!p)p=PG.find(g=>g[2]&&can(g[2]))[0];let body;
if(!allowed(p)){aud('Acceso denegado a «'+p+'»','ruta','403');body=head('403','Acceso denegado','Tu rol ('+S.me.rol+') no tiene permiso para esta pantalla.')+'<div class="notice deny">403: la autorización se verifica en cada operación y el intento quedó registrado en la auditoría.</div>'}else body=V[p]();
let g='';const nav=PG.filter(x=>allowed(x[0])).map(x=>{const h=x[3]&&x[3]!==g?(g=x[3],`<div class="grp">${x[3]}</div>`):'';return h+`<a href="#${x[0]}" class="${p===x[0]?'on':''}">${x[1]}</a>`}).join('');
app.innerHTML=`<header><div class="brand">monda <small>Plataforma educativa</small></div><div class="row" style="justify-content:flex-end"><span class="tag r-${S.me.rol}">${S.me.rol}</span><small>${esc(S.me.nombre)}</small><button class="s" onclick="S.off=!S.off;R();say(S.off?'Sin conexión: lectura y borradores disponibles; evaluaciones y tutor requieren conexión.':'Conexión recuperada; sincroniza la cola pendiente.')">${S.off?'Sin conexión':'En línea'}</button><button class="s" onclick="logout()">Salir</button></div></header><aside>${nav}</aside><main>${body}<div class="foot">Prototipo interactivo de diseño PI7. Datos ficticios; las acciones simulan el comportamiento y no conectan con servicios reales.</div></main>`}
window.onhashchange=R;R();
</script></html>
